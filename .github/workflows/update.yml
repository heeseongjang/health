name: 수업일지 갱신

on:
  schedule:
    - cron: "0 12 * * *"      # 매일 21:00 KST
  workflow_dispatch:           # Actions 탭에서 수동 실행 (휴대폰에서도 가능)

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet openpyxl

      - name: 시트 읽어서 페이지 생성
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python parse.py
          python build.py

      - name: 변경분이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html workout.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "자동 갱신 $(date -u -d '+9 hours' +%Y-%m-%d)"
            git push
          fi
